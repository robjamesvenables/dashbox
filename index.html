<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashbox</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c0f;--surface:#111318;--surface2:#161a22;--border:#1e2129;--border2:#2a2f3a;
  --text:#c8cdd8;--muted:#4a5060;--accent:#00d4aa;--strong:#00d4aa;--weak:#e05c5c;
  --neutral:#5a8fc4;--gold:#c9a84c;--warn:#e8a23a;
  --font:'Poppins',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden;}

/* HEADER */
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:100;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#00d4aa,#00a86b);border-radius:8px;display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:6px 6px 7px;}
.logo-bar{background:white;border-radius:2px;width:6px;}
.lb1{height:7px;opacity:0.4;}.lb2{height:11px;opacity:0.7;}.lb3{height:15px;opacity:1;}
.logo-text{font-size:18px;font-weight:600;letter-spacing:-0.5px;}
.logo-text span.d{color:#fff;}.logo-text span.b{color:var(--accent);}
.header-right{display:flex;align-items:center;gap:10px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite;}
.live-dot.live{background:var(--accent);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
#clockEl{font-size:10px;color:var(--muted);}
#feedAge{font-size:9px;color:var(--muted);}

.page{padding:14px;}

/* GOLDEN */
.golden-box{background:linear-gradient(135deg,rgba(201,168,76,0.18),rgba(201,168,76,0.05));border:1.5px solid rgba(201,168,76,0.6);border-radius:12px;padding:14px 16px;margin-bottom:16px;}
.golden-label{font-size:9px;letter-spacing:0.18em;color:var(--gold);text-transform:uppercase;margin-bottom:10px;text-align:center;}
.golden-row{display:flex;align-items:center;justify-content:space-around;}
.golden-side{text-align:center;}
.golden-code{font-size:26px;font-weight:700;color:#f5d87a;letter-spacing:-0.5px;}
.golden-code.weak{color:#e0a8a8;}
.golden-tag{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;margin-top:2px;}
.golden-vs{font-size:11px;color:var(--muted);}
.golden-age{font-size:9px;color:var(--muted);text-align:center;margin-top:8px;}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">
      <div class="logo-bar lb1"></div>
      <div class="logo-bar lb2"></div>
      <div class="logo-bar lb3"></div>
    </div>
    <div class="logo-text"><span class="d">Dash</span><span class="b">box</span></div>
  </div>
  <div class="header-right">
    <span class="live-dot" id="liveDot"></span>
    <span id="feedAge">--</span>
    <span id="clockEl">--:--</span>
  </div>
</header>

<!-- INDEX -->
<div class="page" id="tab-index">

  <!-- GOLDEN: strongest vs weakest -->
  <div class="golden-box">
    <div class="golden-label">⭐ Golden — Strongest vs Weakest</div>
    <div class="golden-row">
      <div class="golden-side"><div class="golden-code" id="goldenStrong">--</div><div class="golden-tag">Strongest</div></div>
      <div class="golden-vs">vs</div>
      <div class="golden-side"><div class="golden-code weak" id="goldenWeak">--</div><div class="golden-tag">Weakest</div></div>
    </div>
    <div class="golden-age" id="goldenAge"></div>
  </div>

  <div style="font-size:11px;color:var(--muted);margin-bottom:16px;line-height:1.6;">
    Set conditions to watch on the Daily chart. Alert fires to Telegram when one currency flips stronger than another.
  </div>

  <!-- Add condition -->
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px;">
    <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:10px;">Watch When</div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <select id="idxCurA" style="background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:8px 10px;border-radius:6px;font-family:var(--font);font-size:13px;font-weight:600;">
        <option>AUD</option><option>CAD</option><option>CHF</option><option>EUR</option>
        <option>GBP</option><option>JPY</option><option>NZD</option><option>USD</option>
      </select>
      <div style="font-size:12px;color:var(--muted);">stronger than</div>
      <select id="idxCurB" style="background:var(--surface2);border:1px solid var(--border2);color:var(--text);padding:8px 10px;border-radius:6px;font-family:var(--font);font-size:13px;font-weight:600;">
        <option>USD</option><option>AUD</option><option>CAD</option><option>CHF</option>
        <option>EUR</option><option>GBP</option><option>JPY</option><option>NZD</option>
      </select>
      <button onclick="addIndexCondition()" style="background:linear-gradient(135deg,#00d4aa,#00a86b);border:none;border-radius:6px;padding:8px 18px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;font-family:var(--font);">+ Add</button>
    </div>
  </div>

  <!-- Condition list -->
  <div id="indexConditionList"></div>

  <!-- Current D1 strength -->
  <div style="margin-top:16px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
      <div style="font-size:9px;letter-spacing:0.15em;color:var(--muted);text-transform:uppercase;">Current Daily Strength</div>
      <button onclick="manualRefresh()" id="refreshBtn" style="background:none;border:1px solid var(--border2);border-radius:5px;color:var(--muted);padding:4px 10px;cursor:pointer;font-size:10px;font-family:var(--font);">↻ Refresh</button>
    </div>
    <div id="indexStrengthSnap"></div>
  </div>

  <!-- Raw pair debug -->
  <details style="margin-top:16px;">
    <summary style="font-size:9px;letter-spacing:0.1em;color:var(--muted);text-transform:uppercase;cursor:pointer;">Raw Pair Data (debug)</summary>
    <div id="rawPairDebug" style="margin-top:8px;font-size:10px;color:var(--muted);line-height:1.8;"></div>
  </details>
</div>

<script>
// ═══════════ CONFIG ═══════════
const TELEGRAM_TOKEN = '8500092691:AAHX_wIqo2p9qXOTe0RL-etw_41R1Q2bZXQ';
const TELEGRAM_CHAT_ID = '8361135939';
const TWELVE_KEY = '21ecfbc0db824df8bb8007785b10fe95';

async function sendTelegramAlert(message){
  try {
    const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;
    await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: 'HTML' })
    });
  } catch(e) { console.log('Telegram error:', e); }
}

const SCORE_MAP = { DXY:'USD', EXY:'EUR', BXY:'GBP', AXY:'AUD', NXY:'NZD', CAD:'CAD', CHF:'CHF', JXY:'JPY' };

// ═══════════ LIVE STRENGTH FEED (MT4 EA → Telegram) ═══════════
async function fetchStrengthFromTelegram(){
  try {
    const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/getUpdates?limit=100&allowed_updates=["message"]`;
    const fetchPromise = fetch(url).then(r=>r.json());
    const timeout = new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),8000));
    const data = await Promise.race([fetchPromise, timeout]);
    if(!data.ok) return null;
    const updates = [...(data.result||[])].reverse();
    for(const upd of updates){
      const text = upd?.message?.text || '';
      if(!text.startsWith('DASHBOX_SCORES')) continue;
      const parsed = parseDashboxScores(text.split('||')[0]);
      if(parsed) return parsed;
    }
    return null;
  } catch(e){
    console.log('Telegram fetch failed:', e.message);
    return null;
  }
}

function parseDashboxScores(text){
  // Format: DASHBOX_SCORES|DXY:1.2345|EXY:-0.4567|...|ts:1718435200
  const parts = text.split('|');
  const raw = {};
  let ts = null;
  parts.forEach(p => {
    const [k, v] = p.split(':');
    if(SCORE_MAP[k]) raw[k] = parseFloat(v);
    if(k === 'ts') ts = parseInt(v) * 1000;
  });
  if(Object.keys(raw).length < 8) return null;
  const scores = Object.entries(raw).map(([key, score])=>({
    code: SCORE_MAP[key], score: parseFloat(score.toFixed(2)), ts
  })).sort((a,b)=>b.score-a.score);
  return { scores, ts };
}

function getAgeString(ts){
  if(!ts) return '';
  const age = Math.round((Date.now() - ts) / 1000);
  if(age < 60) return `${age}s ago`;
  if(age < 3600) return `${Math.round(age/60)}m ago`;
  return `${Math.round(age/3600)}h ago`;
}

// ═══════════ LIVE STRENGTH FEED — TWELVE DATA (no MT4/EA needed) ═══════════
// True currency strength: each currency's score is the average of its directional
// % change across all 7 pairs it appears in (28 pairs total across 8 currencies).
const FOREX_PAIRS = [
  'EURUSD','GBPUSD','AUDUSD','NZDUSD','USDCAD','USDCHF','USDJPY',
  'EURJPY','GBPJPY','AUDJPY','NZDJPY','CADJPY','CHFJPY',
  'EURGBP','EURAUD','EURNZD','EURCAD','EURCHF',
  'GBPAUD','GBPNZD','GBPCAD','GBPCHF',
  'AUDNZD','AUDCAD','AUDCHF','NZDCAD','NZDCHF','CADCHF'
];

async function fetchTDChunk(pairs){
  const symbols = pairs.map(p => p.slice(0,3)+'/'+p.slice(3,6)).join(',');
  const url = `https://api.twelvedata.com/time_series?symbol=${symbols}&interval=1day&outputsize=2&apikey=${TWELVE_KEY}`;
  const fetchPromise = fetch(url).then(r=>r.json());
  const timeout = new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000));
  const data = await Promise.race([fetchPromise, timeout]);
  if(data && data.code && data.status === 'error') throw new Error('TD error '+data.code+': '+data.message);
  const out = {};
  pairs.forEach(p => {
    const sym = p.slice(0,3)+'/'+p.slice(3,6);
    const entry = pairs.length===1 ? data : data[sym];
    if(entry && entry.values && entry.values.length >= 2){
      const latest = parseFloat(entry.values[0].close);
      const prevClose = parseFloat(entry.values[1].close);
      if(!isNaN(latest) && !isNaN(prevClose) && prevClose !== 0){
        out[p] = (latest - prevClose) / prevClose * 100; // % change since yesterday's D1 close, same basis as a broker's Daily candle
      }
    }
  });
  return out;
}

// Fetches a chunk, retrying on failure/rate-limit before giving up on those pairs
async function fetchTDChunkWithRetry(chunk, maxRetries){
  for(let attempt=0; attempt<=maxRetries; attempt++){
    try {
      const data = await fetchTDChunk(chunk);
      if(Object.keys(data).length === chunk.length) return data; // full success
      if(attempt < maxRetries){ await sleep(20000); continue; } // partial — retry
      return data; // out of retries, return whatever we got
    } catch(e){
      console.log('Chunk fetch error (attempt '+attempt+'):', e.message);
      if(attempt < maxRetries) await sleep(20000);
    }
  }
  return {};
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function fetchStrengthFromTwelveData(onProgress){
  try {
    const chunkSize = 7;
    const results = {};
    for(let i=0; i<FOREX_PAIRS.length; i+=chunkSize){
      const chunk = FOREX_PAIRS.slice(i, i+chunkSize);
      const chunkData = await fetchTDChunkWithRetry(chunk, 2);
      Object.assign(results, chunkData);
      if(onProgress) onProgress(buildScoresFromPairs(results));
      drawRawPairDebug(results);
      if(i+chunkSize < FOREX_PAIRS.length) await sleep(12000); // stay safely under 8 credits/min
    }
    const scores = buildScoresFromPairs(results, true);
    if(!scores) return null;
    return {scores, ts: Date.now()};
  } catch(e){
    console.log('Twelve Data fetch failed:', e.message);
    return null;
  }
}

function drawRawPairDebug(results){
  const el = document.getElementById('rawPairDebug');
  if(!el) return;
  let html = '';
  FOREX_PAIRS.forEach(p=>{
    const v = results[p];
    html += `<div>${p}: ${v!==undefined ? (v>0?'+':'')+v.toFixed(3)+'%' : '—'}</div>`;
  });
  el.innerHTML = html;
}

// Averages each currency's directional % change across every pair it appears in.
// requireComplete=true only returns a result once all 28 pairs are in (used for final score).
function buildScoresFromPairs(results, requireComplete){
  const totals = {}; const counts = {};
  ['USD','EUR','GBP','AUD','NZD','CAD','CHF','JPY'].forEach(c=>{totals[c]=0;counts[c]=0;});
  FOREX_PAIRS.forEach(pair=>{
    if(results[pair] === undefined) return;
    const base = pair.slice(0,3), quote = pair.slice(3,6);
    const pc = results[pair];
    totals[base]+=pc; counts[base]++;
    totals[quote]-=pc; counts[quote]++;
  });
  if(requireComplete && Object.values(counts).some(c=>c<6)) return null; // allow 1 dropped pair per currency
  const ts = Date.now();
  return Object.keys(totals)
    .filter(c=>counts[c]>0)
    .map(c=>({code:c, score: parseFloat((totals[c]/counts[c]).toFixed(2)), ts}))
    .sort((a,b)=>b.score-a.score);
}

// ═══════════ INDEX TAB ═══════════
let indexConditions = [];
let indexStrengthScores = [];
let conditionFlipState = {}; // tracks last known true/false per condition, for alert-on-change only

async function renderIndex(){
  loadIndexConditions();
  let result = await fetchStrengthFromTelegram();
  let source = 'EA';
  if(!result){
    source = 'TwelveData';
    const feedAge = document.getElementById('feedAge');
    if(feedAge) feedAge.textContent = 'loading full index…';
    result = await fetchStrengthFromTwelveData(partial => {
      indexStrengthScores = partial;
      drawIndexStrengthSnap();
      drawGolden();
    });
  }
  const liveDot = document.getElementById('liveDot');
  const feedAge = document.getElementById('feedAge');
  if(result && result.scores.length > 0){
    indexStrengthScores = result.scores;
    if(liveDot) liveDot.classList.add('live');
    if(feedAge) feedAge.textContent = getAgeString(result.ts) + ' · ' + source;
  } else {
    if(liveDot) liveDot.classList.remove('live');
    if(feedAge) feedAge.textContent = indexStrengthScores.length ? 'stale' : 'no signal';
  }
  drawIndexConditions();
  drawIndexStrengthSnap();
  drawGolden();
  checkConditionFlips();
  checkGoldenFlip();
}

function loadIndexConditions(){
  try {
    const saved = localStorage.getItem('dashbox_index_conditions');
    if(saved) indexConditions = JSON.parse(saved);
  } catch(e){ indexConditions = []; }
}

function saveIndexConditions(){
  try { localStorage.setItem('dashbox_index_conditions', JSON.stringify(indexConditions)); }
  catch(e){ console.log('Save error:', e); }
}

function addIndexCondition(){
  const curA = document.getElementById('idxCurA').value;
  const curB = document.getElementById('idxCurB').value;
  if(curA === curB){ alert('Please select two different currencies'); return; }
  const exists = indexConditions.find(c=>c.curA===curA && c.curB===curB);
  if(exists){ alert('This condition already exists'); return; }
  indexConditions.push({curA, curB});
  drawIndexConditions();
  saveIndexConditions();
}

function removeIndexCondition(idx){
  const cond = indexConditions[idx];
  if(cond) delete conditionFlipState[cond.curA+'_'+cond.curB];
  indexConditions.splice(idx, 1);
  drawIndexConditions();
  saveIndexConditions();
}

function drawIndexConditions(){
  const c = document.getElementById('indexConditionList');
  if(!c) return;
  if(indexConditions.length === 0){
    c.innerHTML = '<div style="text-align:center;padding:20px;font-size:12px;color:var(--muted);">No conditions set yet — add one above.</div>';
    return;
  }
  let html = '';
  indexConditions.forEach((cond, idx) => {
    const aStr = indexStrengthScores.find(s=>s.code===cond.curA);
    const bStr = indexStrengthScores.find(s=>s.code===cond.curB);
    const aVal = aStr ? aStr.score : null;
    const bVal = bStr ? bStr.score : null;
    const gap = aVal !== null && bVal !== null ? aVal - bVal : null;
    const isTrue = gap !== null && gap > 0;
    const isSolid = gap !== null && gap >= 0.5;
    const borderColor = isSolid ? 'rgba(0,212,170,0.5)' : isTrue ? 'rgba(255,200,0,0.3)' : 'var(--border)';
    const statusColor = isSolid ? 'var(--strong)' : isTrue ? '#f5d87a' : 'var(--muted)';
    const statusText = aVal !== null ? (isSolid ? '✅ Confirmed — solid signal' : isTrue ? '⚠️ Too close — watching' : '⏳ Not yet') : '⏳ Loading...';
    const diff = aVal !== null && bVal !== null ? Math.abs(aVal - bVal).toFixed(2) : '--';
    const aDisp = aVal !== null ? (aVal > 0 ? '+' : '') + aVal.toFixed(2) : '--';
    const bDisp = bVal !== null ? (bVal > 0 ? '+' : '') + bVal.toFixed(2) : '--';
    html += `<div style="background:var(--surface);border:1px solid ${borderColor};border-radius:10px;padding:14px 16px;margin-bottom:8px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <div style="font-size:15px;font-weight:700;color:#e8ecf4;">${cond.curA} <span style="color:var(--muted);font-size:11px;font-weight:400;">stronger than</span> ${cond.curB}</div>
        <button onclick="removeIndexCondition(${idx})" style="background:none;border:1px solid var(--border2);border-radius:4px;color:var(--muted);padding:3px 8px;cursor:pointer;font-size:11px;">✕</button>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;gap:12px;">
          <div style="text-align:center;">
            <div style="font-size:9px;color:var(--muted);margin-bottom:2px;">${cond.curA}</div>
            <div style="font-size:13px;font-weight:600;color:${aVal>0?'var(--strong)':'var(--weak)'};">${aDisp}</div>
          </div>
          <div style="text-align:center;">
            <div style="font-size:9px;color:var(--muted);margin-bottom:2px;">${cond.curB}</div>
            <div style="font-size:13px;font-weight:600;color:${bVal>0?'var(--strong)':'var(--weak)'};">${bDisp}</div>
          </div>
          <div style="text-align:center;">
            <div style="font-size:9px;color:var(--muted);margin-bottom:2px;">GAP</div>
            <div style="font-size:13px;font-weight:600;color:var(--muted);">${diff}</div>
          </div>
        </div>
        <div style="font-size:11px;font-weight:700;color:${statusColor};text-align:right;">${statusText}</div>
      </div>
    </div>`;
  });
  c.innerHTML = html;
}

function drawIndexStrengthSnap(){
  const c = document.getElementById('indexStrengthSnap');
  if(!c) return;
  if(!indexStrengthScores || indexStrengthScores.length === 0){
    c.innerHTML = '<div style="font-size:11px;color:var(--muted);">No strength data — EA not connected yet.</div>';
    return;
  }
  const sorted = [...indexStrengthScores].sort((a,b)=>b.score-a.score);
  let html = '<div style="display:flex;flex-direction:column;gap:5px;">';
  sorted.forEach(s => {
    const col = s.score>0?'var(--strong)':s.score<0?'var(--weak)':'var(--muted)';
    const barW = Math.min(Math.abs(s.score)/3*100, 100);
    html += `<div style="display:flex;align-items:center;gap:8px;">
      <div style="font-size:11px;font-weight:600;color:#e8ecf4;width:36px;">${s.code}</div>
      <div style="flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden;">
        <div style="width:${barW}%;height:100%;background:${col};border-radius:3px;"></div>
      </div>
      <div style="font-size:11px;color:${col};width:45px;text-align:right;">${s.score>0?'+':''}${s.score.toFixed(2)}</div>
    </div>`;
  });
  html += '</div>';
  c.innerHTML = html;
}

// Fires a Telegram alert the moment a condition flips from false → true (only while this tab is open)
function checkConditionFlips(){
  indexConditions.forEach(cond => {
    const aStr = indexStrengthScores.find(s=>s.code===cond.curA);
    const bStr = indexStrengthScores.find(s=>s.code===cond.curB);
    if(!aStr || !bStr) return;
    const isTrue = (aStr.score - bStr.score) > 0;
    const key = cond.curA+'_'+cond.curB;
    const wasTrue = conditionFlipState[key];
    if(isTrue && !wasTrue){
      sendTelegramAlert(`🔔 <b>DASHBOX FLIP</b>\n\n<b>${cond.curA}</b> just flipped stronger than <b>${cond.curB}</b>\n\n${cond.curA}: ${aStr.score>0?'+':''}${aStr.score.toFixed(2)}\n${cond.curB}: ${bStr.score>0?'+':''}${bStr.score.toFixed(2)}`);
    }
    conditionFlipState[key] = isTrue;
  });
}

// ═══════════ GOLDEN: strongest/weakest flip alert ═══════════
let goldenState = JSON.parse(localStorage.getItem('dashbox_golden_state') || 'null') || {strong: null, weak: null};

function drawGolden(){
  const strongEl = document.getElementById('goldenStrong');
  const weakEl = document.getElementById('goldenWeak');
  const ageEl = document.getElementById('goldenAge');
  if(!indexStrengthScores || indexStrengthScores.length === 0) return;
  const sorted = [...indexStrengthScores].sort((a,b)=>b.score-a.score);
  const strongest = sorted[0];
  const weakest = sorted[sorted.length-1];
  if(strongEl) strongEl.textContent = strongest.code;
  if(weakEl) weakEl.textContent = weakest.code;
  if(ageEl) ageEl.textContent = document.getElementById('feedAge') ? document.getElementById('feedAge').textContent : '';
}

function checkGoldenFlip(){
  if(!indexStrengthScores || indexStrengthScores.length === 0) return;
  const sorted = [...indexStrengthScores].sort((a,b)=>b.score-a.score);
  const strongest = sorted[0].code;
  const weakest = sorted[sorted.length-1].code;
  const prevStrong = goldenState.strong;
  const prevWeak = goldenState.weak;
  const strongFlipped = prevStrong !== null && prevStrong !== strongest;
  const weakFlipped = prevWeak !== null && prevWeak !== weakest;
  if(strongFlipped || weakFlipped){
    let msg = `🌟 <b>GOLDEN SIGNAL</b>\n\n`;
    if(strongFlipped) msg += `Strongest flipped: <b>${prevStrong} → ${strongest}</b>\n`;
    if(weakFlipped) msg += `Weakest flipped: <b>${prevWeak} → ${weakest}</b>\n`;
    msg += `\nNow: ${strongest} (strongest) vs ${weakest} (weakest)`;
    sendTelegramAlert(msg);
  }
  goldenState = {strong: strongest, weak: weakest};
  localStorage.setItem('dashbox_golden_state', JSON.stringify(goldenState));
}

let lastManualRefresh = 0;
async function manualRefresh(){
  const now = Date.now();
  if(now - lastManualRefresh < 120000){ alert('Just refreshed — give it a couple minutes before refreshing again to stay within the free data quota.'); return; }
  lastManualRefresh = now;
  const btn = document.getElementById('refreshBtn');
  if(btn){ btn.textContent = '↻ Refreshing…'; btn.disabled = true; }
  await renderIndex();
  if(btn){ btn.textContent = '↻ Refresh'; btn.disabled = false; }
}

async function testTelegram(){  await sendTelegramAlert(`✅ <b>Dashbox Connected!</b>\n\nTelegram alerts are working.`);
  alert('Test alert sent to Telegram!');
}

// ═══════════ CLOCK ═══════════
function updateClock(){
  const sgt=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Singapore'}));
  const t=[sgt.getHours(),sgt.getMinutes()].map(n=>String(n).padStart(2,'0')).join(':');
  document.getElementById('clockEl').textContent=t;
}

// ═══════════ INIT ═══════════
setInterval(updateClock,1000);
updateClock();
renderIndex();
setInterval(renderIndex, 3600000); // hourly — 28-pair pull uses ~672 of the 800 daily free credits
</script>
